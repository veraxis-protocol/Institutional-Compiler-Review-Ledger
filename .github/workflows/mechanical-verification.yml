name: mechanical-verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, full-SHA pinned
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify ledger mechanics
        env:
          LEDGER_ACTOR: ${{ github.actor }}
          LEDGER_BRANCH: ${{ github.head_ref }}
          LEDGER_BASE: ${{ github.event.pull_request.base.sha }}
          LEDGER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 verifier/ledger_core_verifier.py verify-pr               --actor "$LEDGER_ACTOR"               --branch "$LEDGER_BRANCH"               --base "$LEDGER_BASE"               --head "$LEDGER_HEAD"
          else
            python3 verifier/ledger_core_verifier.py verify-all
          fi
